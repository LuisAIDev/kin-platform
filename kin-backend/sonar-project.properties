# SonarQube configuration (FASE 11 — Quality Gate)
# Requiere un servidor SonarQube y SONAR_TOKEN/SONAR_HOST_URL en el CI.

sonar.projectKey=kin-platform
sonar.projectName=KIN Platform
sonar.organization=kin-platform

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Quality Gate por defecto (coverage, duplicación, maintainability, reliability, security)
