# ============================================================
# KIN Platform - RENDER profile (Fase 13)
# Blueprint: render.yaml. Reutiliza la config de PROD y añade
# ajustes específicos de Render (sin romper el perfil prod).
# ============================================================
spring.profiles.include=prod

server.port=${PORT:8080}

# Reducción de threads Tomcat para la instancia starter de 512 MiB
# (el default de Spring Boot es 200 threads / 10 min-spare).
server.tomcat.threads.max=50
server.tomcat.threads.min-spare-threads=5
server.tomcat.accept-count=25

# Reducción del pool Hikari para la instancia starter de 512 MiB
# (prod usa maximum-pool-size=10; aquí se acota para el plan Render).
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Health probes (readiness/liveness) para Render
# DB EXCLUIDO del readiness para evitar despertar la BD cada 30s (Neon Free)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState
management.health.db.enabled=false

# Compresión de respuestas API
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024
