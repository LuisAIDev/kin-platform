spring:
  # Datasource: lo provee Testcontainers (PostgreSQL 18) vía @DynamicPropertySource
  # en los tests de integración, o variables de entorno en CI/E2E. Sin URL fija.
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  rate-limit:
    enabled: false
