spring:
  # Datasource: lo provee Testcontainers (PostgreSQL 18) vía @DynamicPropertySource
  # en los tests de integración, o variables de entorno en CI/E2E. Sin URL fija.
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Tests: secreto Base64 >= 32 bytes (JwtService.validateSecret). No usar en prod.
  secret: a2luLXBsYXRmb3JtLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1wcm9kdWN0aW9uLWNlcnRpZmljYXRpb24tMjAyNi0wMTIzNDU2Nzg5YWJjZGVm

app:
  rate-limit:
    enabled: false
  mail:
    # Tests: sin SMTP real, se usa LoggingEmailSender.
    enabled: false

kin:
  health:
    telemedicine:
      # Tests: clave de cifrado de telemedicina para tests de integración.
      # Debe ser != clave de desarrollo y >= 32 chars (ContentCipher.validate()).
      crypto-secret: kin-test-telemedicine-crypto-secret-0123456789
  ai:
    # Tests: sin precios de DeepSeek configurados; el control de costo queda
    # desactivado (el fail-fast no aplica) y los tests ejercitan el gate a
    # nivel de servicio con mocks.
    cost-control:
      enabled: false
  # Tests: deshabilitar relé del outbox por defecto (se habilita en tests específicos)
  outbox:
    relay:
      enabled: false
