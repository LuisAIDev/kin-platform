# ============================================================
# KIN Platform — PRODUCTION profile (Neon / PostgreSQL 18)
# ============================================================

server.port=${PORT:8080}

# Datasource: Neon. Todas las credenciales provienen de variables de entorno
# (sin secretos fijos ni URLs H2). DATABASE_URL debe ser JDBC:
#   jdbc:postgresql://<host>.aws.neon.tech/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

jwt.secret=${JWT_SECRET}

# CORS: el frontend de producción siempre debe estar permitido. Si ALLOWED_ORIGINS
# está definido en Render, DEBE incluir https://kin-platform.com (el código
# garantiza además que este origen nunca se pierda).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://kin-platform.com}

# Rate limiting: tras Render LB el remoteAddr es el del proxy; confiar en
# X-Forwarded-For solo es seguro porque todo el tráfico pasa por el LB de Render.
app.rate-limit.trust-proxy-headers=true

# Sesión: cookie HttpOnly. En producción (HTTPS y dominios cruzados
# vercel.app -> onrender.com) Secure=true y SameSite=None.
app.session.cookie-secure=true
app.session.cookie-same-site=None

# ============================================================
# Email verification (verificación obligatoria de correo)
# ============================================================
# app.mail.enabled=true EXIGE SMTP: si MAIL_HOST/MAIL_FROM no están
# configurados, la aplicación falla explícitamente (nunca usa el
# LoggingEmailSender en producción).
# Default false: activación EXPLÍCITA mediante APP_MAIL_ENABLED=true en entorno.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:KIN Platform}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL base del frontend para construir el enlace de verificación.
app.frontend.base-url=${FRONTEND_BASE_URL:https://kin-platform.com}

# URL base del frontend Medical (KIN Medical), usada para los enlaces públicos
# de compartición de triaje. Es independiente de app.frontend.base-url (Empresas).
medical.frontend.base-url=${MEDICAL_FRONTEND_BASE_URL:https://www.kin-platform-medical.com}

# ============================================================
# Licenciamiento On-Premise
# ============================================================
# En producción el arranque DEBE fallar si la licencia falta o es inválida.
# El application.yml base define ${KIN_LICENSE_FAIL_FAST:false}; aquí se fija
# el default de PRODUCCIÓN en true (sobreescribible solo vía env si se necesita
# una ventana de migración).
kin.license.fail-fast=${KIN_LICENSE_FAIL_FAST:true}

# Logging: application.yml habilita com.kinplatform=DEBUG. El relé del outbox
# hace polling cada 2 s y registra "No hay eventos pendientes en el outbox" en
# DEBUG, saturando los logs de producción. Se eleva SOLO este logger a INFO
# (logger más específico gana sobre el nivel de paquete).
logging.level.com.kinplatform.kin.infrastructure.outbox.OutboxRelay=INFO

