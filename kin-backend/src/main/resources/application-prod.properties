# ============================================================
# KIN Platform — PRODUCTION profile (Neon / PostgreSQL 18)
# ============================================================

server.port=${PORT:8080}

# Datasource: Neon. Todas las credenciales provienen de variables de entorno
# (sin secretos fijos ni URLs H2). DATABASE_URL debe ser JDBC:
#   jdbc:postgresql://<host>.aws.neon.tech/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

jwt.secret=${JWT_SECRET}

# CORS: el frontend de producción (Vercel) siempre debe estar permitido.
# Si ALLOWED_ORIGINS está definido en Render, DEBE incluir https://kin-platform.vercel.app
# (el código garantiza además que este origen nunca se pierda).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://kin-platform.vercel.app}

# Rate limiting: tras Render LB el remoteAddr es el del proxy; confiar en
# X-Forwarded-For solo es seguro porque todo el tráfico pasa por el LB de Render.
app.rate-limit.trust-proxy-headers=true

# Sesión: cookie HttpOnly. En producción (HTTPS y dominios cruzados
# vercel.app -> onrender.com) Secure=true y SameSite=None.
app.session.cookie-secure=true
app.session.cookie-same-site=None

