# ============================================================
# KIN Platform — PRODUCTION profile (Render)
# ============================================================

server.port=${PORT:8080}

# Datasource: Render expone DATABASE_URL como postgresql:// (no JDBC). Se deriva
# una URL JDBC de DB_HOST/DB_PORT/DB_NAME (declarados en render.yaml via
# fromDatabase). JDBC_DATABASE_URL permite override manual sin tocar el resto.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

spring.h2.console.enabled=false

jwt.secret=${JWT_SECRET}

# CORS: el frontend de producción (Vercel) siempre debe estar permitido.
# Si ALLOWED_ORIGINS está definido en Render, DEBE incluir https://kin-platform.vercel.app
# (el código garantiza además que este origen nunca se pierda).
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,https://kin-platform.vercel.app}

# Rate limiting: tras Render LB el remoteAddr es el del proxy; confiar en
# X-Forwarded-For solo es seguro porque todo el tráfico pasa por el LB de Render.
app.rate-limit.trust-proxy-headers=true

