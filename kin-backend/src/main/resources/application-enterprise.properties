# ============================================================
# KIN Platform - ENTERPRISE profile (Fase 13)
# Tuning para despliegues Enterprise (equivalente a PROD + ajustes).
# No altera el dominio; solo configuración de infraestructura.
# ============================================================
spring.profiles.include=prod

# Pool Hikari ampliado para carga Enterprise
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-init-sql=SELECT 1

# Health probes (readiness/liveness) para orquestadores (K8s/Render)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Compresión de respuestas
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# HTTP/2 requiere TLS (certificado); se habilita cuando exista terminación TLS en la app.
# server.http2.enabled=true

# Caché Redis opcional (adaptador detrás de KnowledgeRepository)
kin.cache.redis.enabled=${KIN_REDIS_ENABLED:false}
