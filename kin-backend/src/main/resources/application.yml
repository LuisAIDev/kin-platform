# ============================================================
# KIN Platform - Spring Boot Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 2MB
  # Fase 13: compresión de respuestas API
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

spring:
  application:
    name: kin-backend

  # -----------------------------------------------------------
  # Multipart — subida de documentos del proyecto (POST /documents).
  # El límite real de la aplicación es 10 MB (validado en el servicio);
  # los límites de Tomcat se dejan algo por encima para que el archivo
  # llegue al controller y se devuelva un error controlado (400) y no un
  # fallo de infraestructura.
  # -----------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

  # -----------------------------------------------------------
  # Spring Security — dispatcher types de la cadena de seguridad.
  # Se EXCLUYE ASYNC: la autorización se decide en el dispatch REQUEST
  # inicial (JWT + SubscriptionAccessFilter + AuthorizationFilter). El
  # dispatch ASYNC que Tomcat ejecuta al completar un SSE (SseEmitter) no
  # debe re-evaluar la autorización: re-ejecutarla con el contexto vacío
  # (los filtros custom no se re-aplican en ese dispatch) produce
  # AccessDeniedException "response already committed". El endpoint
  # /chat/stream sigue protegido en el dispatch inicial.
  # -----------------------------------------------------------
  security:
    filter:
      dispatcher-types: request,error

  # -----------------------------------------------------------
  # JPA / Hibernate — el datasource lo aporta cada perfil
  # (dev / prod / test); no hay base por defecto ni H2.
  # -----------------------------------------------------------
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        default_batch_fetch_size: 50
        enable_lazy_load_no_trans: false
        connection:
          provider_disables_autocommit: false

  # -----------------------------------------------------------
  # Flyway — deshabilitado por defecto; lo habilitan los perfiles
  # (dev vía application-dev.yml, prod vía application-prod.properties).
  # Las migraciones V1..V11 administran el esquema PostgreSQL.
  # -----------------------------------------------------------
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  # -----------------------------------------------------------
  # Caché — en memoria por defecto (spring-boot-starter-data-redis está en el
  # classpath y, sin spring.cache.type, Spring Boot auto-configura RedisCacheManager,
  # lo que hace fallar @Cacheable (p. ej. SubscriptionValidatorService) con
  # "Unable to connect to Redis" cuando no hay servidor Redis. Redis es opcional:
  # para usarlo, definir spring.cache.type=redis junto a kin.cache.redis.enabled=true.
  # -----------------------------------------------------------
  cache:
    type: simple

  # -----------------------------------------------------------
  # Jackson
  # -----------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # -----------------------------------------------------------
  # Spring AI — proveedor DeepSeek (único)
  # -----------------------------------------------------------
  ai:
    # DeepSeek es el único proveedor real de IA; los autoconfigs de OpenAI
    # quedan fuera del classpath y el arranque no exige OPENAI_API_KEY.
    # El ChatModel real es el bean expuesto por DeepSeekConfig.
    model:
      chat: deepseek

# -----------------------------------------------------------
# DeepSeek — proveedor principal de IA
# -----------------------------------------------------------
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  # 2026-07-30: Migrated from deepseek-v3-flash (invalid) to deepseek-v4-flash.
  # deepseek-chat and deepseek-reasoner were deprecated on 2026-07-24.
  model: deepseek-v4-flash

# -----------------------------------------------------------
# Actuator — health check + metrics (Fase 7 observabilidad:
# se exponen metrics y prometheus para monitoreo Enterprise;
# Fase 13: probes readiness/liveness para orquestadores)
# -----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState

  # Redis es una caché opcional (kin.cache.redis.enabled=false por defecto).
  # Sin servidor Redis disponible, su HealthIndicator marcaría el health global
  # como DOWN pese a que la app no lo requiere. Se excluye del agregado.
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# -----------------------------------------------------------
# Stripe
# -----------------------------------------------------------
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# -----------------------------------------------------------
# JWT
# -----------------------------------------------------------
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# -----------------------------------------------------------
# dotenv — busca .env en la raíz del repo (no en kin-backend/)
# -----------------------------------------------------------
springdotenv:
  directory: ${SPRINGDOTENV_DIRECTORY:../}

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
logging:
  level:
    root: INFO
    com.kinplatform: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO
