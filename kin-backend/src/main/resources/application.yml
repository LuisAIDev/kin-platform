# ============================================================
# KIN Platform - Spring Boot Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 2MB
  # Fase 13: compresión de respuestas API
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

spring:
  application:
    name: kin-backend

  # -----------------------------------------------------------
  # JPA / Hibernate — el datasource lo aporta cada perfil
  # (dev / prod / test); no hay base por defecto ni H2.
  # -----------------------------------------------------------
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        default_batch_fetch_size: 50
        enable_lazy_load_no_trans: false
        connection:
          provider_disables_autocommit: false

  # -----------------------------------------------------------
  # Flyway — deshabilitado por defecto; lo habilitan los perfiles
  # (dev vía application-dev.yml, prod vía application-prod.properties).
  # Las migraciones V1..V11 administran el esquema PostgreSQL.
  # -----------------------------------------------------------
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  # -----------------------------------------------------------
  # Caché — en memoria por defecto (spring-boot-starter-data-redis está en el
  # classpath y, sin spring.cache.type, Spring Boot auto-configura RedisCacheManager,
  # lo que hace fallar @Cacheable (p. ej. SubscriptionValidatorService) con
  # "Unable to connect to Redis" cuando no hay servidor Redis. Redis es opcional:
  # para usarlo, definir spring.cache.type=redis junto a kin.cache.redis.enabled=true.
  # -----------------------------------------------------------
  cache:
    type: simple

  # -----------------------------------------------------------
  # Jackson
  # -----------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # -----------------------------------------------------------
  # Spring AI — OpenAI (fallback)
  # -----------------------------------------------------------
  ai:
    # Selección de modelo: 'deepseek' desactiva el autoconfig OpenAI de Spring AI
    # (OpenAiChatAutoConfiguration), de modo que el arranque NO exige
    # OPENAI_API_KEY. El ChatModel real es el bean expuesto por DeepSeekConfig.
    model:
      chat: deepseek
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        options:
          temperature: 0.7

# -----------------------------------------------------------
# DeepSeek — proveedor principal de IA
# -----------------------------------------------------------
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  # 2026-07-30: Migrated from deepseek-v3-flash (invalid) to deepseek-v4-flash.
  # deepseek-chat and deepseek-reasoner were deprecated on 2026-07-24.
  model: deepseek-v4-flash

# -----------------------------------------------------------
# AI provider control — enables/disables OpenAI fallback
# -----------------------------------------------------------
ai:
  openai:
    enabled: true

# -----------------------------------------------------------
# Actuator — health check + metrics (Fase 7 observabilidad:
# se exponen metrics y prometheus para monitoreo Enterprise;
# Fase 13: probes readiness/liveness para orquestadores)
# -----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState

  # Redis es una caché opcional (kin.cache.redis.enabled=false por defecto).
  # Sin servidor Redis disponible, su HealthIndicator marcaría el health global
  # como DOWN pese a que la app no lo requiere. Se excluye del agregado.
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# -----------------------------------------------------------
# Stripe
# -----------------------------------------------------------
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# -----------------------------------------------------------
# JWT
# -----------------------------------------------------------
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

# -----------------------------------------------------------
# dotenv — busca .env en la raíz del repo (no en kin-backend/)
# -----------------------------------------------------------
springdotenv:
  directory: ${SPRINGDOTENV_DIRECTORY:../}

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
logging:
  level:
    root: INFO
    com.kinplatform: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO
