# ============================================================
# KIN Platform - Spring Boot Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    max-swallow-size: 2MB
  # Fase 13: compresión de respuestas API
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

spring:
  application:
    name: kin-backend

  # -----------------------------------------------------------
  # Multipart — subida de documentos del proyecto (POST /documents).
  # El límite real de la aplicación es 10 MB (validado en el servicio);
  # los límites de Tomcat se dejan algo por encima para que el archivo
  # llegue al controller y se devuelva un error controlado (400) y no un
  # fallo de infraestructura.
  # -----------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

  # -----------------------------------------------------------
  # Spring Security — dispatcher types de la cadena de seguridad.
  # Se EXCLUYE ASYNC: la autorización se decide en el dispatch REQUEST
  # inicial (JWT + SubscriptionAccessFilter + AuthorizationFilter). El
  # dispatch ASYNC que Tomcat ejecuta al completar un SSE (SseEmitter) no
  # debe re-evaluar la autorización: re-ejecutarla con el contexto vacío
  # (los filtros custom no se re-aplican en ese dispatch) produce
  # AccessDeniedException "response already committed". El endpoint
  # /chat/stream sigue protegido en el dispatch inicial.
  # -----------------------------------------------------------
  security:
    filter:
      dispatcher-types: request,error

  # -----------------------------------------------------------
  # JPA / Hibernate — el datasource lo aporta cada perfil
  # (dev / prod / test); no hay base por defecto ni H2.
  # -----------------------------------------------------------
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        default_batch_fetch_size: 50
        enable_lazy_load_no_trans: false
        connection:
          provider_disables_autocommit: false

  # -----------------------------------------------------------
  # Flyway — deshabilitado por defecto; lo habilitan los perfiles
  # (dev vía application-dev.yml, prod vía application-prod.properties).
  # Las migraciones V1..V11 administran el esquema PostgreSQL.
  # -----------------------------------------------------------
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  # -----------------------------------------------------------
  # Caché — en memoria por defecto (spring-boot-starter-data-redis está en el
  # classpath y, sin spring.cache.type, Spring Boot auto-configura RedisCacheManager,
  # lo que hace fallar @Cacheable (p. ej. SubscriptionValidatorService) con
  # "Unable to connect to Redis" cuando no hay servidor Redis. Redis es opcional:
  # para usarlo, definir spring.cache.type=redis junto a kin.cache.redis.enabled=true.
  # -----------------------------------------------------------
  cache:
    type: simple

  # -----------------------------------------------------------
  # Spring Data Redis — SOLO repositories scanning deshabilitado (Fase 14/OOM).
  # No elimina funcionalidad Redis: RedisKnowledgeRepository (clase plana detrás
  # de RedisCacheConfig, opt-in con kin.cache.redis.enabled=true) y el
  # RedisTemplate/StringRedisTemplate siguen funcionando. No existe ninguna
  # interfaz RedisRepository en el código; todos los repositorios son JPA.
  # Evita "Multiple Spring Data modules found, entering strict repository
  # configuration mode" y su sobrecarga de escaneo en el arranque.
  # -----------------------------------------------------------
  data:
    redis:
      repositories:
        enabled: false

  # -----------------------------------------------------------
  # Jackson
  # -----------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # -----------------------------------------------------------
  # Spring AI — proveedor DeepSeek (único)
  # -----------------------------------------------------------
  ai:
    # DeepSeek es el único proveedor real de IA; los autoconfigs de OpenAI
    # quedan fuera del classpath y el arranque no exige OPENAI_API_KEY.
    # El ChatModel real es el bean expuesto por DeepSeekConfig.
    model:
      chat: deepseek

# -----------------------------------------------------------
# DeepSeek — proveedor principal de IA
# -----------------------------------------------------------
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  # 2026-07-30: Migrated from deepseek-v3-flash (invalid) to deepseek-v4-flash.
  # deepseek-chat and deepseek-reasoner were deprecated on 2026-07-24.
  model: deepseek-v4-flash
  # Costo por millón de tokens (Fase 1 — control de consumo de IA).
  # Precios REALES de deepseek-v4-flash: PENDIENTES DE CONFIRMAR. Si quedan
  # en 0, el gate de costo se desactiva con log explícito (no se inventa el
  # precio). Configurar ANTES de habilitar KIN_AI_COST_CONTROL_ENABLED=true
  # en producción.
  cost:
    input-per-1m: ${DEEPSEEK_INPUT_COST_PER_1M:0}
    output-per-1m: ${DEEPSEEK_OUTPUT_COST_PER_1M:0}
  stream:
    # Timeout de inactividad del streaming SSE: si DeepSeek no entrega NINGÚN
    # chunk durante estos segundos, el stream falla de forma controlada
    # (TimeoutException -> evento SSE de error) en vez de colgar hasta el
    # timeout del SseEmitter (180 s). Cada chunk recibido reinicia el contador.
    inactivity-timeout-seconds: ${DEEPSEEK_STREAM_INACTIVITY_TIMEOUT_SECONDS:90}

# -----------------------------------------------------------
# Control de consumo de IA (Fase 1)
# -----------------------------------------------------------
kin:
  ai:
    # Gate de costo antes de llamar a DeepSeek (reserva atómica por período).
    cost-control:
      enabled: ${KIN_AI_COST_CONTROL_ENABLED:true}
    # Límite máximo estimado (USD) por solicitud: impide que una única
    # petición consuma una proporción excesiva del presupuesto.
    max-request-estimate-usd: ${KIN_AI_MAX_REQUEST_ESTIMATE_USD:1.00}
    # Tope de salida usado por el estimador heurístico (tokens).
    max-output-tokens: ${KIN_AI_MAX_OUTPUT_TOKENS:4096}
    # Presupuestos de IA por plan y período (fuente inicial del seed; el
    # valor operativo vive en PricingPlan.aiBudgetUsd).
    free:
      budget-usd: ${KIN_FREE_AI_BUDGET_USD:0.50}
    standard:
      budget-usd: ${KIN_STANDARD_AI_BUDGET_USD:6.25}
    premium:
      budget-usd: ${KIN_PREMIUM_AI_BUDGET_USD:8.75}
  # -----------------------------------------------------------
  # Adquisición de conocimiento externo (ADR-021)
  # Defaults offline-first: allowlist vacía + master switch deshabilitado.
  # El adaptador HTTP seguro (SecureHttpClient + SourceConnectionGuard) se
  # registra solo con KNOWLEDGE_EXTERNAL_ENABLED=true y exige una allowlist
  # explícita (KNOWLEDGE_ALLOWED_DOMAINS) en producción.
  # -----------------------------------------------------------
  knowledge:
    # Dominios de conexión permitidos (comma-separated). Vacío = offline-first
    # (SourceValidator.strict()): ningún candidato externo entra al análisis.
    allowed-domains: ${KNOWLEDGE_ALLOWED_DOMAINS:}
    # Master switch del adapter HTTP real.
    external-enabled: ${KNOWLEDGE_EXTERNAL_ENABLED:false}
    # Modo sombra (ADR-025, Fase 1): ejecuta el motor completo (métricas/caché)
    # pero NO propaga knowledgeResult al enriquecimiento (invisible para el usuario).
    shadow-enabled: ${KNOWLEDGE_SHADOW_ENABLED:false}
    http:
      source-id: ${KNOWLEDGE_HTTP_SOURCE_ID:external-http}
      source-name: ${KNOWLEDGE_HTTP_SOURCE_NAME:External Knowledge}
      # URL base de la fuente autorizada (requerida cuando está habilitado).
      base-url: ${KNOWLEDGE_HTTP_BASE_URL:}
      connect-timeout: 1s
      request-timeout: 3s
      max-response-bytes: 262144
      max-redirects: 3
      allowed-content-types: ${KNOWLEDGE_HTTP_CONTENT_TYPES:application/json}
      retries: 1
      retry-backoff: 250ms
      # Solo dev/test: permite hosts loopback explícitos (nunca en prod).
      allow-loopback: false
    test-source:
      # Fuente controlada determinista para dev/test/E2E (sin red).
      enabled: ${KNOWLEDGE_TEST_SOURCE_ENABLED:false}

  # -----------------------------------------------------------
  # Módulo de Triaje Digital (ADR-028) — Salud
  # Herramienta de apoyo informativo (no sustituye el diagnóstico médico).
  # -----------------------------------------------------------
  health:
    triage:
      # Master switch del módulo.
      enabled: ${KIN_HEALTH_TRIAGE_ENABLED:true}
      # Límite máximo de condiciones en el resultado.
      max-conditions: ${KIN_HEALTH_TRIAGE_MAX_CONDITIONS:5}
      # Fuente de conocimiento: db (default) o file (futuro).
      data-source: ${KIN_HEALTH_TRIAGE_DATA_SOURCE:db}
      # SymptomExtractor: NLP (OpenNLP, fallback determinista) vs keywords.
      nlp-enabled: ${KIN_HEALTH_TRIAGE_NLP_ENABLED:true}
      # Auto-actualización del catálogo desde fuentes externas (fase de
      # consolidación). Default false: la importación solo ocurre bajo demanda
      # vía /admin/health/catalog/import-from-external. Los datos importados
      # entran como PENDING y deben pasar validación clínica.
      auto-update: ${KIN_HEALTH_TRIAGE_AUTO_UPDATE:false}
      # Caché del catálogo (fase de producción): envuelve el repositorio JPA con
      # @Cacheable (en memoria por defecto; Redis si spring.cache.type=redis).
      catalog-cache-enabled: ${KIN_HEALTH_TRIAGE_CATALOG_CACHE_ENABLED:true}
      # Enriquecimiento del catálogo desde fuentes externas (fase profesional).
      # Defaults offline-first: el bundle empaquetado (data/triage-catalog-extended.json)
      # alimenta la actualización bajo demanda sin red.
      catalog:
        source-id: ${KIN_HEALTH_TRIAGE_CATALOG_SOURCE_ID:health-catalog}
        source-name: ${KIN_HEALTH_TRIAGE_CATALOG_SOURCE_NAME:Health Catalog}
        # Master switch de la API médica externa (WHO/PubMed/dataset estructurado).
        external-enabled: ${KIN_HEALTH_TRIAGE_CATALOG_EXTERNAL_ENABLED:false}
        # URL base de la API médica externa (requerida cuando está habilitada).
        base-url: ${KIN_HEALTH_TRIAGE_CATALOG_BASE_URL:}
        # Recurso empaquetado del dataset CIE-10/WHO (offline-first).
        bundled-resource: ${KIN_HEALTH_TRIAGE_CATALOG_BUNDLED_RESOURCE:data/triage-catalog-extended.json}

  # -----------------------------------------------------------
  # Diagnóstico Diferencial (ADR-029) — Salud
  # Herramienta de apoyo informativo (no sustituye el diagnóstico médico).
  # -----------------------------------------------------------
  differential:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_DIFFERENTIAL_ENABLED:true}
    # Límite máximo de ítems en el resultado.
    max-items: ${KIN_HEALTH_DIFFERENTIAL_MAX_ITEMS:5}
    # Enriquecimiento del catálogo (factores de riesgo y pruebas) desde fuentes
    # externas. Defaults offline-first: bundle empaquetado.
    catalog:
      source-id: ${KIN_HEALTH_DIFFERENTIAL_CATALOG_SOURCE_ID:health-differential}
      source-name: ${KIN_HEALTH_DIFFERENTIAL_CATALOG_SOURCE_NAME:Health Differential Catalog}
      external-enabled: ${KIN_HEALTH_DIFFERENTIAL_CATALOG_EXTERNAL_ENABLED:false}
      base-url: ${KIN_HEALTH_DIFFERENTIAL_CATALOG_BASE_URL:}
      bundled-resource: ${KIN_HEALTH_DIFFERENTIAL_CATALOG_BUNDLED_RESOURCE:data/differential-catalog.json}

  # -----------------------------------------------------------
  # Dashboard de Salud del Paciente (ADR-030)
  # Panel centralizado: resumen, historial, perfil y plan de cuidado.
  # -----------------------------------------------------------
  dashboard:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_DASHBOARD_ENABLED:true}
    # Límite de condiciones más frecuentes en el resumen.
    top-conditions: ${KIN_HEALTH_DASHBOARD_TOP_CONDITIONS:3}

  # -----------------------------------------------------------
  # Portal para Médicos (ADR-031)
  # Lista de pacientes, resumen clínico, historial y alertas.
  # -----------------------------------------------------------
  physician:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_PHYSICIAN_ENABLED:true}
    # Invitación de pacientes (ciclo de vida V30).
    invite-enabled: ${KIN_HEALTH_PHYSICIAN_INVITE_ENABLED:true}
    # Correo de notificación al paciente cuando recibe una invitación.
    invitation-email-enabled: ${KIN_HEALTH_PHYSICIAN_INVITATION_EMAIL_ENABLED:true}
    # Bypass de cuota de invitaciones: true ignora el plan SALUD_PROFESIONAL y el
    # límite de pacientes (solo tiene efecto si enforce-invite-quota=true).
    allow-unlimited-invites: ${KIN_HEALTH_PHYSICIAN_ALLOW_UNLIMITED_INVITES:${ALLOW_UNLIMITED_INVITES:false}}
    # Master switch de la cuota de invitaciones. Fase piloto: false = cuota
    # DESACTIVADA (invitar no exige plan ni límite y NO depende de variables del
    # dashboard). GA: fijar a true para volver a exigir plan Profesional.
    enforce-invite-quota: ${KIN_HEALTH_PHYSICIAN_ENFORCE_INVITE_QUOTA:${KIN_ENFORCE_PHYSICIAN_INVITE_QUOTA:false}}

  # -----------------------------------------------------------
  # Telemedicina (ADR-032) — mensajería asíncrona y citas
  # -----------------------------------------------------------
  telemedicine:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_TELEMEDICINE_ENABLED:true}
    # Clave para cifrar el contenido de mensajes en reposo (AES/GCM).
    # En producción DEBE configurarse con un secreto propio.
    crypto-secret: ${KIN_HEALTH_TELEMEDICINE_CRYPTO_SECRET:kin-telemedicine-dev-key}

  # -----------------------------------------------------------
  # Seguimiento de pacientes (ADR-033) — planes, tareas y evolución
  # -----------------------------------------------------------
  followup:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_FOLLOWUP_ENABLED:true}
    # Anticipación (días) del recordatorio automático de tareas.
    reminder-days-before: ${KIN_HEALTH_FOLLOWUP_REMINDER_DAYS_BEFORE:1}
    # Días sin evolución que disparan una alerta al médico.
    evolution-alert-days: ${KIN_HEALTH_FOLLOWUP_EVOLUTION_ALERT_DAYS:7}

  # -----------------------------------------------------------
  # Agenda y disponibilidad (ADR-034) — horarios, slots y citas
  # -----------------------------------------------------------
  scheduling:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_SCHEDULING_ENABLED:true}
    # Anticipación (horas) del recordatorio de citas confirmadas.
    reminder-hours-before: ${KIN_HEALTH_SCHEDULING_REMINDER_HOURS_BEFORE:24}
    # Horas sin confirmar tras las que se recuerda al médico.
    confirmation-reminder-hours: ${KIN_HEALTH_SCHEDULING_CONFIRMATION_REMINDER_HOURS:24}

  # -----------------------------------------------------------
  # Auditoría de accesos a datos de salud (ADR-035)
  # -----------------------------------------------------------
  audit:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_AUDIT_ENABLED:true}
    # Retención de logs en días.
    retention-days: ${KIN_HEALTH_AUDIT_RETENTION_DAYS:365}

  # -----------------------------------------------------------
  # Documentos clínicos compartidos (ADR-036)
  # -----------------------------------------------------------
  documents:
    # Master switch del módulo.
    enabled: ${KIN_HEALTH_DOCUMENTS_ENABLED:true}
    # Carpeta local de almacenamiento de archivos.
    storage-path: ${KIN_HEALTH_DOCUMENTS_STORAGE_PATH:./storage/documents}
    # Tamaño máximo de archivo en bytes (default 10 MB).
    max-file-size: ${KIN_HEALTH_DOCUMENTS_MAX_FILE_SIZE:10485760}

  # -----------------------------------------------------------
  # Verificación clínica con la OMS (ADR-041)
  # Centro de Documentos Clínicos: la IA verifica contra la ICD-API
  # (CIE-10/11) y consulta el GHO ANTES de explicar un resultado.
  # ICD-API: OAuth2 Client Credentials. Obtener client id/secret en
  # https://icd.who.int/icdapi (View API access key). Sin credenciales
  # la IA degrada: avisa que no pudo verificar y no inventa datos.
  # -----------------------------------------------------------
  verification:
    # Master switch del paso de verificación OMS en el análisis IA.
    enabled: ${KIN_HEALTH_VERIFICATION_ENABLED:true}
    # Circuit Breaker: umbral de fallos para abrir y ms que permanece abierto.
    failure-threshold: ${WHO_CIRCUIT_FAILURE_THRESHOLD:3}
    open-timeout-millis: ${WHO_CIRCUIT_OPEN_TIMEOUT_MILLIS:30000}
    icd:
      # Habilitar consultas a la ICD-API (requiere credenciales).
      enabled: ${WHO_ICD_ENABLED:false}
      # Base URL de la API de la OMS (cloud).
      base-url: ${WHO_ICD_BASE_URL:https://id.who.int}
      # Versión del contrato de la API (cabecera API-Version).
      api-version: ${WHO_ICD_API_VERSION:v2}
      # Release de la clasificación (ICD-11 MMS).
      release-id: ${WHO_ICD_RELEASE_ID:2024-01}
      # Token endpoint OAuth2 de la OMS.
      token-endpoint: ${WHO_ICD_TOKEN_ENDPOINT:https://icdaccessmanagement.who.int/connect/token}
      scope: ${WHO_ICD_SCOPE:icdapi_access}
      client-id: ${WHO_ICD_CLIENT_ID:}
      client-secret: ${WHO_ICD_CLIENT_SECRET:}
      max-results: ${WHO_ICD_MAX_RESULTS:5}
      max-queries-per-turn: ${WHO_ICD_MAX_QUERIES_PER_TURN:2}
    gho:
      # El GHO no requiere credenciales.
      enabled: ${WHO_GHO_ENABLED:true}
      base-url: ${WHO_GHO_BASE_URL:https://apps.who.int/gho/athena/api/GHO}
      # Indicadores consultados automáticamente (opcional). Cada entrada:
      #   - indicatorCode: código del catálogo GHO
      #   - label: etiqueta para el prompt
      #   - countryCode: ISO 3166-1 alpha-3 (vacío = dimensión GLOBAL)
      indicators: []

  # -----------------------------------------------------------
  # Transactional Outbox (ADR-026, KIN 2.4)
  # Garantiza entrega at-least-once de Domain Events escribiendo en la misma
  # transacción del caso de uso. El relé (OutboxRelay) publica asíncronamente.
  # -----------------------------------------------------------
  outbox:
    # Master switch: si false, el publicador no persiste eventos (útil para tests
    # que no quieren tocar la BD). Default true.
    enabled: ${KIN_OUTBOX_ENABLED:true}
    # Relé asíncrono que procesa eventos PENDING y los publica en DomainEventBus
    relay:
      # Master switch del relé. Si false, no se procesan eventos.
      enabled: ${KIN_OUTBOX_RELAY_ENABLED:true}
      # Intervalo de polling en milisegundos
      poll-interval-ms: ${KIN_OUTBOX_RELAY_POLL_INTERVAL_MS:2000}
      # Tamaño del lote por ciclo de polling
      batch-size: ${KIN_OUTBOX_RELAY_BATCH_SIZE:100}
      # Máximo de reintentos antes de DEAD_LETTER
      max-retries: ${KIN_OUTBOX_RELAY_MAX_RETRIES:5}
      # Base para backoff exponencial (ms)
      backoff-base-ms: ${KIN_OUTBOX_RELAY_BACKOFF_BASE_MS:1000}

# -----------------------------------------------------------
# Actuator — health check + metrics (Fase 7 observabilidad:
# se exponen metrics y prometheus para monitoreo Enterprise;
# Fase 13: probes readiness/liveness para orquestadores)
# -----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState

  # Redis es una caché opcional (kin.cache.redis.enabled=false por defecto).
  # Sin servidor Redis disponible, su HealthIndicator marcaría el health global
  # como DOWN pese a que la app no lo requiere. Se excluye del agregado.
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  # OpenTelemetry tracing distribuido (ADR-022). Deshabilitado por defecto:
  # sin tracer activo el comportamiento observable no cambia (logs JSON usan
  # CorrelationContext). Para habilitarlo: management.tracing.enabled=true y,
  # opcionalmente, OTEL_EXPORTER_OTLP_ENDPOINT para exportar vía OTLP. Sin
  # endpoint no hay exportación: KIN no exige un collector externo.
  tracing:
    enabled: false
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

# -----------------------------------------------------------
# Stripe
# -----------------------------------------------------------
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# -----------------------------------------------------------
# JWT
# -----------------------------------------------------------
jwt:
  secret: ${JWT_SECRET}
  # Access token: 24 h.
  expiration-ms: 86400000
  # Refresh token: 7 días (renovación sin re-autenticar).
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# -----------------------------------------------------------
# dotenv — busca .env en la raíz del repo (no en kin-backend/)
# -----------------------------------------------------------
springdotenv:
  directory: ${SPRINGDOTENV_DIRECTORY:../}

# -----------------------------------------------------------
# Rate limiting (RateLimitingFilter)
# -----------------------------------------------------------
app:
  rate-limit:
    # Master switch del filtro.
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Solo activar tras un proxy de confianza (Render/Vercel): usa X-Forwarded-For.
    trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
    # IPs exentas del rate limiting (comma-separated): p. ej. IPs de administradores
    # o del entorno de pruebas.
    whitelist: ${RATE_LIMIT_WHITELIST:}
    # Límites por prefijo (máximo y ventana). Si no se configura, se usan los
    # valores por defecto del código: /auth/login 10/min, /auth/resend-verification
    # 5/min, /auth/ 10/min, /health/triage/ 30/min, /health/differential/ 30/min,
    # /health/telemedicine/ 60/min.
    # limits:
    #   /auth/login:
    #     max: 10
    #     window: 60s

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
logging:
  level:
    root: INFO
    com.kinplatform: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO
