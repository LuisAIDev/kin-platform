name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "kin-backend/**"
      - "kin-database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kin-backend/**"
      - "kin-database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kin-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify (build + tests + JaCoCo)
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: kin-backend/target/site/jacoco/

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: kin-backend/target/surefire-reports/

      - name: Upload coverage (Codecov, opcional)
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          files: kin-backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: kin-backend
