name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build artifacts & release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: kin-frontend/package-lock.json

      - name: Make Maven Wrapper executable
        working-directory: kin-backend
        run: chmod +x mvnw

      - name: Build backend jar
        working-directory: kin-backend
        run: ./mvnw -B -q -DskipTests package

      - name: Build frontend
        working-directory: kin-frontend
        run: npm ci && npm run build

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp kin-backend/target/*.jar artifacts/kin-backend.jar
          cp -r kin-frontend/.next artifacts/next-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KIN ${{ github.ref_name }}
          body: |
            ## KIN ${{ github.ref_name }}

            Release generado automáticamente por el workflow `release.yml`.

            ### Artefactos
            - `kin-backend.jar` — backend Spring Boot (Java 17)
            - `next-build/` — build de producción Next.js

            ### Changelog
            Ver `CHANGELOG.md`.
          files: artifacts/**
