name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "kin-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kin-frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: kin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit)
        run: npm test

      - name: Upload Vitest coverage (opcional)
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          name: kin-frontend

      - name: Next.js build
        run: npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: kin-frontend/.next/

  e2e:
    name: Playwright E2E (login flow)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: kin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17 (backend para E2E)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: kin-backend
        run: chmod +x mvnw

      - name: Build backend (jar)
        working-directory: kin-backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start backend (test profile, H2 en memoria)
        working-directory: kin-backend
        env:
          JWT_SECRET: a2luLXBsYXRmb3JtLXNlY3VyZS1qd3Qtc2VjcmV0LWZvci1wcm9kdWN0aW9uLWNlcnRpZmljYXRpb24tMjAyNi0wMTIzNDU2Nzg5YWJjZGVm
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=test --springdotenv.enabled=false > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/actuator/health > /dev/null; then break; fi
            sleep 2
          done

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: kin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kin-frontend/playwright-report/
          retention-days: 7
