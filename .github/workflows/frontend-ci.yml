name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "kin-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kin-frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: kin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit)
        run: npm test

      - name: Upload Vitest coverage (opcional)
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          flags: frontend
          name: kin-frontend

      - name: Next.js build
        run: npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: kin-frontend/.next/

  e2e:
    name: Playwright E2E (login flow)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kin_e2e
          POSTGRES_USER: kin_e2e
          POSTGRES_PASSWORD: kin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kin_e2e -d kin_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: kin-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (backend para E2E)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: kin-backend
        run: chmod +x mvnw

      - name: Build backend (jar)
        working-directory: kin-backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start backend (test profile, PostgreSQL 18)
        working-directory: kin-backend
        run: |
          # El backend requiere jwt.secret. En CI se genera una JWT_SECRET efimera
          # por ejecucion (nunca se commitea ningun secreto ni se depende de un
          # valor hardcodeado o de un repo secret). El test profile espera una
          # clave base64; cualquier valor aleatorio es valido para los E2E.
          export JWT_SECRET=$(openssl rand -base64 48)
          export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/kin_e2e
          export SPRING_DATASOURCE_USERNAME=kin_e2e
          export SPRING_DATASOURCE_PASSWORD=kin_e2e
          nohup java -jar target/*.jar --spring.profiles.active=test --springdotenv.enabled=false > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/actuator/health > /dev/null; then break; fi
            sleep 2
          done

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: kin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kin-frontend/playwright-report/
          retention-days: 7
