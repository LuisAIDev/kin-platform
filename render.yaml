# Render Blueprint — KIN Platform (Fase 13)
# Despliegue de referencia: PostgreSQL + Backend + Frontend.
# Valores reales (secrets) se configuran en el Dashboard de Render.
databases:
  - name: kin-db
    plan: starter
    databaseName: kin_platform
    user: kin_admin

services:
  # ---------------- Backend API (Spring Boot) ----------------
  - type: web
    name: kin-backend
    runtime: docker
    repo: https://github.com/LuisAIDev/kin-platform
    rootDir: kin-backend
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kin-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: kin-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: kin-db
          property: password
      - key: ALLOWED_ORIGINS
        value: https://kin-frontend.onrender.com,https://kin-platform.vercel.app

  # ---------------- Frontend (Next.js) ----------------
  - type: web
    name: kin-frontend
    runtime: node
    repo: https://github.com/LuisAIDev/kin-platform
    rootDir: kin-frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kin-backend.onrender.com/api/v1
