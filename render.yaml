# Render Blueprint — KIN Platform (Fase 13)
# Despliegue de referencia: PostgreSQL + Backend + Frontend.
# Valores reales (secrets) se configuran en el Dashboard de Render.
databases:
  - name: kin-db
    plan: starter
    databaseName: kin_platform
    user: kin_admin

services:
  # ---------------- Backend API (Spring Boot) ----------------
  - type: web
    name: kin-backend
    runtime: docker
    repo: https://github.com/LuisAIDev/kin-platform
    rootDir: .
    dockerContext: .
    dockerfilePath: ./kin-backend/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        # Fase 1 (ADR-025): modo sombra — engine consulta fuentes reales y genera
        # métricas (kin_knowledge_adapter_* + endpoint /knowledge/metrics) pero NO
        # propaga el resultado al enriquecimiento (invisible para el usuario).
        # ROLLBACK inmediato: volver a "render" (quitar ",shadow") y redeploy.
        value: render,shadow
      - key: JWT_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kin-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: kin-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kin-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kin-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: kin-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: kin-db
          property: password
      - key: ALLOWED_ORIGINS
        value: https://kin-frontend.onrender.com,https://kin-platform.com
      - key: APP_MAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: "KIN Platform"
      # Diagnóstico SMTP (GET /admin/health/email/diagnostic?to=...) y fallback
      # de último recurso (imprime el enlace en logs SOLO para destinatarios de
      # la whitelist; default deshabilitado).
      - key: MAIL_DIAGNOSTIC_TO
        sync: false
      - key: MAIL_DEBUG_FALLBACK
        value: "false"
      - key: MAIL_DEBUG_FALLBACK_ALLOWLIST
        sync: false
      - key: APP_FRONTEND_BASE_URL
        value: "https://www.kin-platform-medical.com"
      # Bypass de cuota de invitaciones (fase piloto E2E): fuerza true en el
      # blueprint para que Render lo aplique por encima de cualquier valor
      # previo del dashboard. Para GA: cambiar a "false" y redeploy.
      - key: KIN_HEALTH_TELEMEDICINE_CRYPTO_SECRET
        sync: false
      - key: ALLOW_UNLIMITED_INVITES
        value: "true"
      - key: KIN_HEALTH_PHYSICIAN_ALLOW_UNLIMITED_INVITES
        value: "true"
      # Master switch de la cuota de invitaciones: false (piloto) = las
      # invitaciones NO exigen plan ni límite, independientemente de otras
      # variables del dashboard. GA: "true".
      - key: KIN_HEALTH_PHYSICIAN_ENFORCE_INVITE_QUOTA
        value: "false"

  # ---------------- Frontend (Next.js) ----------------
  - type: web
    name: kin-frontend
    runtime: node
    repo: https://github.com/LuisAIDev/kin-platform
    rootDir: kin-frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://kin-backend-lwmy.onrender.com/api/v1
      # Formulario de feedback del piloto (botón "Dar feedback" en Mi Salud /
      # Portal Médico). Sustituir por la URL real del formulario.
      - key: NEXT_PUBLIC_FEEDBACK_URL
        value: https://forms.example.com/feedback-piloto
